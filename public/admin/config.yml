backend:
  name: github
  repo: DavidFraimovich/Portfolio
  branch: main
  # GitHub Pages production login still needs a real OAuth provider.
  # Leave custom auth settings out until you have a working provider URL.

site_url: https://davidfraimovich.github.io/Portfolio/
display_url: https://davidfraimovich.github.io/Portfolio/
local_backend: true

publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: ../images/uploads

collections:
  - name: case-studies-en
    label: Case Studies (EN)
    folder: content/en/case-studies
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: date, label: Date, widget: datetime }
      - { name: tags, label: Tags, widget: list, default: [] }
      - { name: role, label: Role, widget: string }
      - { name: context, label: Context, widget: text }
      - { name: goal_metrics, label: Goal Metrics, widget: text }
      - { name: discovery, label: Discovery, widget: text }
      - { name: options_tradeoffs, label: Options Tradeoffs, widget: text }
      - { name: execution, label: Execution, widget: text }
      - { name: results, label: Results, widget: text }
      - { name: learnings, label: Learnings, widget: text }
      - { name: body, label: Body, widget: markdown }

  - name: case-studies-he
    label: Case Studies (HE)
    folder: content/he/case-studies
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { name: title, label: כותרת, widget: string }
      - { name: description, label: תיאור, widget: text }
      - { name: date, label: תאריך, widget: datetime }
      - { name: tags, label: תגיות, widget: list, default: [] }
      - { name: role, label: תפקיד, widget: string }
      - { name: context, label: הקשר, widget: text }
      - { name: goal_metrics, label: יעדי הצלחה, widget: text }
      - { name: discovery, label: תובנות מחקר, widget: text }
      - { name: options_tradeoffs, label: אפשרויות ופשרות, widget: text }
      - { name: execution, label: ביצוע, widget: text }
      - { name: results, label: תוצאות, widget: text }
      - { name: learnings, label: תובנות, widget: text }
      - { name: body, label: תוכן, widget: markdown }

  - name: posts-en
    label: Posts (EN)
    folder: content/en/posts
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: date, label: Date, widget: datetime }
      - { name: tags, label: Tags, widget: list, default: [] }
      - { name: body, label: Body, widget: markdown }

  - name: posts-he
    label: Posts (HE)
    folder: content/he/posts
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { name: title, label: כותרת, widget: string }
      - { name: description, label: תיאור, widget: text }
      - { name: date, label: תאריך, widget: datetime }
      - { name: tags, label: תגיות, widget: list, default: [] }
      - { name: body, label: תוכן, widget: markdown }

  - name: site
    label: Site Content
    files:
      - name: site_en
        label: Site UI (EN)
        file: content/site/en.json
        format: json
        fields:
          - { name: site_title, label: Site Title, widget: string }
          - { name: brand_name, label: Brand Name, widget: string }
          - { name: headline, label: Headline, widget: string }
          - { name: subheadline, label: Subheadline, widget: text }
          - { name: primary_cta_text, label: Primary CTA Text, widget: string }
          - { name: linkedin_url, label: LinkedIn URL, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: nav_home, label: Nav Home, widget: string }
          - { name: nav_case_studies, label: Nav Case Studies, widget: string }
          - { name: nav_resume, label: Nav Resume, widget: string }
          - { name: nav_about, label: Nav About, widget: string }
          - { name: nav_contact, label: Nav Contact, widget: string }
          - { name: home_selected_case_studies, label: Home Selected Case Studies, widget: string }
          - { name: home_latest_posts, label: Home Latest Posts, widget: string }
          - { name: case_studies_title, label: Case Studies Title, widget: string }
          - { name: case_studies_intro, label: Case Studies Intro, widget: text }
          - { name: about_title, label: About Title, widget: string }
          - { name: about_intro, label: About Intro, widget: text }
          - { name: about_how_i_work_title, label: About How I Work Title, widget: string }
          - { name: about_how_i_work_text, label: About How I Work Text, widget: text }
          - { name: about_core_strengths_title, label: About Core Strengths Title, widget: string }
          - { name: about_core_strengths_text, label: About Core Strengths Text, widget: text }
          - { name: resume_title, label: Resume Title, widget: string }
          - { name: resume_intro, label: Resume Intro, widget: text }
          - { name: resume_experience_title, label: Resume Experience Title, widget: string }
          - { name: resume_experience_text, label: Resume Experience Text, widget: text }
          - { name: resume_technology_title, label: Resume Technology Title, widget: string }
          - { name: resume_technology_text, label: Resume Technology Text, widget: text }
          - { name: contact_title, label: Contact Title, widget: string }
          - { name: contact_intro, label: Contact Intro, widget: text }
          - { name: contact_email_label, label: Contact Email Label, widget: string }
          - { name: contact_linkedin_label, label: Contact LinkedIn Label, widget: string }
          - { name: detail_role_label, label: Detail Role Label, widget: string }
          - { name: detail_context_label, label: Detail Context Label, widget: string }
          - { name: detail_goal_metrics_label, label: Detail Goal Metrics Label, widget: string }
          - { name: detail_discovery_label, label: Detail Discovery Label, widget: string }
          - { name: detail_options_tradeoffs_label, label: Detail Options Tradeoffs Label, widget: string }
          - { name: detail_execution_label, label: Detail Execution Label, widget: string }
          - { name: detail_results_label, label: Detail Results Label, widget: string }
          - { name: detail_learnings_label, label: Detail Learnings Label, widget: string }
          - { name: footer_note, label: Footer Note, widget: string }

      - name: site_he
        label: Site UI (HE)
        file: content/site/he.json
        format: json
        fields:
          - { name: site_title, label: כותרת אתר, widget: string }
          - { name: brand_name, label: שם מותג, widget: string }
