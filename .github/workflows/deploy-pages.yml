name: Deploy Next.js static export to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate public runtime config
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          TELEGRAM_DEPLOY_GROUP_TOKEN: ${{ vars.TELEGRAM_DEPLOY_GROUP_TOKEN || secrets.TELEGRAM_DEPLOY_GROUP_TOKEN }}
          TELEGRAM_DEPLOY_GROUP_ID: ${{ vars.TELEGRAM_DEPLOY_GROUP_ID || secrets.TELEGRAM_DEPLOY_GROUP_ID }}
        run: |
          if [ -n "$TELEGRAM_DEPLOY_GROUP_TOKEN" ] && [ -n "$TELEGRAM_DEPLOY_GROUP_ID" ]; then
            echo "Direct Telegram delivery is enabled for this build."
            echo "Warning: the Telegram bot token and chat ID will be embedded into the public client bundle."
          elif [ -z "$NEXT_PUBLIC_CONTACT_FORM_ENDPOINT" ]; then
            echo "No contact form transport is configured for the github-pages environment."
            echo "Set TELEGRAM_DEPLOY_GROUP_TOKEN + TELEGRAM_DEPLOY_GROUP_ID for direct Telegram delivery,"
            echo "or set NEXT_PUBLIC_CONTACT_FORM_ENDPOINT for relay mode."
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_GA_MEASUREMENT_ID" ]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID is missing for the github-pages environment."
            echo "The deploy can continue, but GA4 pageviews and events will not be sent."
          fi

      - name: Build static export
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_SITE_URL: https://davidfraimovich.github.io/Portfolio/
          NEXT_PUBLIC_ASSET_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_TELEGRAM_DEPLOY_GROUP_TOKEN: ${{ vars.TELEGRAM_DEPLOY_GROUP_TOKEN || secrets.TELEGRAM_DEPLOY_GROUP_TOKEN }}
          NEXT_PUBLIC_TELEGRAM_DEPLOY_GROUP_ID: ${{ vars.TELEGRAM_DEPLOY_GROUP_ID || secrets.TELEGRAM_DEPLOY_GROUP_ID }}

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
